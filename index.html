
<script>
(function () {
  // URL Cloudflare Worker
  var API_URL = "https://asisten-minjas-api-proxy.sewajas-tanjungpinang.workers.dev";

  var msgs = document.getElementById("msgs");
  var form = document.getElementById("composer");
  var q = document.getElementById("q");
  var sendBtn = document.getElementById("send");
  var chips = document.getElementById("chips");
  var statusEl = document.getElementById("status");

  var busy = false;
  var turns = [];

  function setBusy(on) {
    busy = on;
    q.disabled = on;
    sendBtn.disabled = on;

    Array.prototype.forEach.call(chips.children, function (chip) {
      chip.disabled = on;
    });

    statusEl.textContent = on ? "Sedang menjawab..." : "Siap menjawab";
  }

  function add(cls, text) {
    var d = document.createElement("div");
    d.className = "msg " + cls;
    d.textContent = text;
    msgs.appendChild(d);
    msgs.scrollTop = msgs.scrollHeight;
    return d;
  }

  function done() {
    setBusy(false);
    msgs.scrollTop = msgs.scrollHeight;

    if (window.matchMedia("(min-width: 601px)").matches) {
      q.focus({ preventScroll: true });
    }
  }

  async function ask(text) {
    text = (text || "").trim();

    if (!text || busy) return;

    setBusy(true);
    chips.hidden = true;
    q.value = "";

    add("user", text);
    turns.push({ role: "user", content: text });

    var bubble = add("bot", "Sedang mengetik...");
    var controller = window.AbortController
      ? new AbortController()
      : null;

    var timeout = controller
      ? window.setTimeout(function () {
          controller.abort();
        }, 30000)
      : null;

    try {
      var response = await fetch(API_URL, {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          messages: turns.slice(-10)
        }),
        signal: controller ? controller.signal : undefined
      });

      var responseText = await response.text();
      var result;

      try {
        result = JSON.parse(responseText);
      } catch (e) {
        throw new Error("Respons server bukan JSON: " + responseText);
      }

      if (!response.ok) {
        throw new Error(
          result.error || ("HTTP " + response.status)
        );
      }

      if (result && result.reply) {
        bubble.textContent = result.reply;
        turns.push({
          role: "assistant",
          content: result.reply
        });
      } else {
        bubble.textContent =
          (result && result.error) ||
          "Asisten sedang bermasalah. Coba lagi.";
        turns.pop();
      }

    } catch (err) {
      console.error("Asisten MinJas error:", err);

      bubble.textContent =
        "Maaf, terjadi kendala saat menghubungkan ke server. " +
        (err.name === "AbortError"
          ? "Waktu permintaan habis."
          : err.message);

      turns.pop();

    } finally {
      if (timeout) {
        window.clearTimeout(timeout);
      }

      done();
    }
  }

  form.addEventListener("submit", function (ev) {
    ev.preventDefault();
    ask(q.value);
  });

  chips.addEventListener("click", function (ev) {
    var button = ev.target.closest(".chip");

    if (button && !button.disabled) {
      ask(button.textContent);
    }
  });

  setBusy(false);
})();
</script>
