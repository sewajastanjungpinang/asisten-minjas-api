<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Asisten MinJas</title>
<style>
:root {
  --maroon: #7A1F2B;
  --maroon-bright: #B3303F;
  --white: #FFFFFF;
  --cream: #FFFBF3;
  --ink: #2B1215;
  --muted: #7B5F62;
  --line: #EFE3D0;
  color-scheme: light;
}
* { box-sizing: border-box; font-family: Arial, Helvetica, sans-serif; }
html { min-height: 100%; background: var(--cream); }
body { min-height: 100vh; min-height: 100dvh; margin: 0; background: var(--cream); color: var(--ink); font-size: 16px; line-height: 1.5; -webkit-text-size-adjust: 100%; }
button, input { font: inherit; }
button { -webkit-tap-highlight-color: transparent; }

[hidden] { display: none !important; }
:focus-visible { outline: 3px solid var(--maroon-bright); outline-offset: 2px; }

.page { min-height: 100vh; min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 16px; padding-top: max(12px, env(safe-area-inset-top)); padding-bottom: max(12px, env(safe-area-inset-bottom)); }
.chat { width: 100%; max-width: 640px; height: min(700px, calc(100vh - 32px)); height: min(700px, calc(100dvh - 32px)); min-height: 420px; display: flex; flex-direction: column; background: var(--white); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; box-shadow: 0 6px 24px rgba(122, 31, 43, .10); }
.top { background: var(--maroon); color: #FFFFFF; padding: 14px 18px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.top strong { font-size: 18px; }
.top span { font-size: 13px; opacity: .9; }
.msgs { flex: 1; min-height: 0; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 10px; background: var(--cream); }
.msg { max-width: 86%; padding: 10px 14px; border-radius: 10px; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.bot { align-self: flex-start; background: var(--white); border: 1px solid var(--line); border-top-left-radius: 2px; }
.msg.user { align-self: flex-end; background: var(--maroon); color: #FFFFFF; border-top-right-radius: 2px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 18px 0; background: var(--white); }
.chip { border: 1px solid var(--line); background: var(--white); color: var(--maroon); border-radius: 999px; padding: 6px 12px; font-size: 14px; cursor: pointer; }
.chip:hover { background: var(--cream); }
.chip:disabled { opacity: .5; cursor: default; }
.composer { display: flex; gap: 8px; padding: 12px 18px 8px; background: var(--white); }
.composer input { flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--cream); color: var(--ink); border-radius: 4px; padding: 11px 12px; font-size: 16px; }
.composer input:disabled { opacity: .6; }
.btn { border: 0; border-radius: 4px; padding: 0 18px; font-weight: 700; font-size: 16px; cursor: pointer; background: var(--maroon); color: #FFFFFF; }
.btn:hover { background: var(--maroon-bright); }
.btn:disabled { opacity: .6; cursor: default; }
.fine { font-size: 13px; color: var(--muted); padding: 0 18px 14px; background: var(--white); }
.fine a { color: var(--maroon); font-weight: 700; }
@media (max-width: 600px) {
  .page { padding: 0; display: block; }
  .chat { width: 100%; max-width: none; height: 100vh; height: 100dvh; min-height: 0; border: 0; border-radius: 0; box-shadow: none; }
  .top { padding: 12px 14px; padding-top: max(12px, env(safe-area-inset-top)); }
  .msgs { padding: 14px; }
  .chips { padding: 10px 12px 0; gap: 6px; }
  .chip { min-height: 38px; padding: 7px 10px; }
  .composer { padding: 10px 12px 8px; }
  .btn { min-height: 44px; padding: 0 14px; }
  .fine { padding: 0 12px max(12px, env(safe-area-inset-bottom)); }
}
</style>
</head>
<body>
<div class="page">
  <div class="chat">
    <div class="top"><strong>Asisten MinJas</strong><span id="status">Menyiapkan...</span></div>
    <div class="msgs" id="msgs" aria-live="polite">
      <div class="msg bot">Halo! Saya MinJas, asisten Sewa Jas Tanjungpinang. Mau tanya harga, paket, cara booking, atau aturan sewa? Silakan tulis pertanyaanmu.</div>
    </div>
    <div class="chips" id="chips">
      <button class="chip" type="button">Berapa harga paket set?</button>
      <button class="chip" type="button">Bagaimana cara booking?</button>
      <button class="chip" type="button">Bisa bayar pakai QRIS?</button>
      <button class="chip" type="button">Bisa pickup Go-Send tanpa fitting?</button>
      <button class="chip" type="button">Kalau telat berapa dendanya?</button>
    </div>
    <form class="composer" id="composer">
      <input id="q" type="text" autocomplete="off" placeholder="Tulis pertanyaan..." aria-label="Pertanyaan" maxlength="500">
      <button class="btn" id="send" type="submit">Kirim</button>
    </form>
    <p class="fine" style="margin:0">Asisten AI bisa keliru. Untuk pertanyaan lain, chat Admin di <a href="https://wa.me/6283152347759" target="_blank" rel="noopener">WhatsApp 083152347759</a>. Jangan tulis data pribadi di chat.</p>
  </div>
</div>

<script>
(function () {
  // Ganti nilai ini setelah Cloudflare Worker dibuat.
  var API_URL = "https://asisten-minjas-api-proxy.sewajas-tanjungpinang.workers.dev";
  var msgs = document.getElementById("msgs");
  var form = document.getElementById("composer");
  var q = document.getElementById("q");
  var sendBtn = document.getElementById("send");
  var chips = document.getElementById("chips");
  var statusEl = document.getElementById("status");
  var busy = false;
  var turns = [];

  function setBusy(on) {
    busy = on;
    q.disabled = on;
    sendBtn.disabled = on;
    Array.prototype.forEach.call(chips.children, function (c) { c.disabled = on; });
    statusEl.textContent = on ? "Sedang menjawab..." : "Siap menjawab";
  }

  function add(cls, text) {
    var d = document.createElement("div");
    d.className = "msg " + cls;
    d.textContent = text;
    msgs.appendChild(d);
    msgs.scrollTop = msgs.scrollHeight;
    return d;
  }

  function done() {
    setBusy(false);
    msgs.scrollTop = msgs.scrollHeight;
    if (window.matchMedia("(min-width: 601px)").matches) q.focus({ preventScroll: true });
  }

  async function ask(text) {
    text = (text || "").trim();
    if (!text || busy) return;
    if (!API_URL || API_URL.indexOf("GANTI-NAMA-WORKER") !== -1) {
      add("bot", "Aplikasi belum dikonfigurasi. Silakan hubungi Admin.");
      return;
    }
    setBusy(true);
    chips.hidden = true;
    q.value = "";
    add("user", text);
    turns.push({ role: "user", content: text });
    var bubble = add("bot", "Sedang mengetik...");
    var controller = window.AbortController ? new AbortController() : null;
    var timeout = controller ? window.setTimeout(function () { controller.abort(); }, 30000) : null;
    try {
      var response = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages: turns.slice(-10) }),
        signal: controller ? controller.signal : undefined
      });
      if (!response.ok) throw new Error("HTTP " + response.status);
      var result = await response.json();
      if (result && result.reply) {
        bubble.textContent = result.reply;
        turns.push({ role: "assistant", content: result.reply });
      } else {
        bubble.textContent = (result && result.error) || "Asisten sedang bermasalah. Coba lagi sebentar lagi.";
        turns.pop();
      }
    } catch (err) {
      bubble.textContent = "Tidak bisa terhubung ke Asisten MinJas. Periksa koneksi internet lalu coba lagi, atau chat Admin di WhatsApp 083152347759.";
      turns.pop();
    } finally {
      if (timeout) window.clearTimeout(timeout);
      done();
    }
  }

  form.addEventListener("submit", function (ev) { ev.preventDefault(); ask(q.value); });
  chips.addEventListener("click", function (ev) {
    var b = ev.target.closest(".chip");
    if (b && !b.disabled) ask(b.textContent);
  });
  statusEl.textContent = "Siap menjawab";
  setBusy(false);
})();
</script>
</body>
</html>
